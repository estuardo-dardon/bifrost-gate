services:
  redis:
    image: redis:latest
    container_name: bifrost_redis_test
    ports:
      - "6379:6379"
    restart: unless-stopped

  bifrost-gate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bifrost_gate_test
    depends_on:
      - redis
    ports:
      - "2704:2704"
    cap_add:
      - NET_ADMIN
    volumes:
      - bifrost_data:/var/lib/bifrost
      - bifrost_logs:/var/log/bifrost
      - swanctl_conf:/etc/swanctl
    environment:
      - BIFROST_CONFIG=/app/config.toml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: bifrost_prometheus_test
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - bifrost-gate
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: bifrost_grafana_test
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  bifrost_data:
  bifrost_logs:
  swanctl_conf:
  prometheus_data:
  grafana_data:
